<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese deck curator</title>
<style>
:root{color-scheme:light;--ink:#17231d;--muted:#66726c;--paper:#f5f3ec;--card:#fffdf8;--line:#dcd9ce;--green:#21664a;--green2:#e2f1e8;--red:#a54138;--shadow:0 12px 34px #263c3020}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:5;background:#173e30;color:white;padding:18px max(22px,calc((100vw - 1500px)/2));box-shadow:0 2px 12px #0002}.toprow,.actions,.filters,.pager,.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toprow{justify-content:space-between}.brand h1{font:700 24px/1.1 Georgia,serif;margin:0}.brand small{color:#cce0d5}.actions button,.fileBtn{border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:8px;padding:8px 12px;cursor:pointer}.actions .primary{background:#f4c95d;border-color:#f4c95d;color:#252312;font-weight:700}.fileBtn input{display:none}main{max-width:1500px;margin:0 auto;padding:22px}.stats{margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:9px;box-shadow:var(--shadow)}.stat b{font-size:18px}.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:16px}.filters input,.filters select{border:1px solid var(--line);border-radius:7px;background:white;padding:9px}.search{flex:1;min-width:240px}.check{display:flex;gap:6px;align-items:center;color:var(--muted)}.deck{display:grid;gap:10px}.card{display:grid;grid-template-columns:36px minmax(125px,1fr) minmax(115px,.9fr) minmax(145px,1.15fr) 65px minmax(125px,1fr) minmax(240px,2fr) 36px;gap:9px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 2px 8px #263c300a}.card.excluded{opacity:.58;background:#eee}.card input,.card select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:white}.card input:focus,.card select:focus,.filters input:focus{outline:2px solid #68a98a;outline-offset:1px}.toggle{width:22px!important;height:22px;margin:7px}.remove{border:0;background:transparent;color:var(--red);font-size:20px;cursor:pointer}.head{color:var(--muted);font-size:12px;padding:0 11px;display:grid;grid-template-columns:36px minmax(125px,1fr) minmax(115px,.9fr) minmax(145px,1.15fr) 65px minmax(125px,1fr) minmax(240px,2fr) 36px;gap:9px}.pager{justify-content:center;margin:20px}.pager button{padding:8px 13px;border:1px solid var(--line);background:var(--card);border-radius:7px;cursor:pointer}.empty{text-align:center;padding:60px;color:var(--muted)}.dirty{color:#f4c95d!important}#toast{position:fixed;right:20px;bottom:20px;background:#18251f;color:white;padding:11px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:none}@media(max-width:900px){.head{display:none}.card{grid-template-columns:34px 1fr 1fr}.card .wide{grid-column:2/-1}.card .remove{grid-column:1}.top{position:static}main{padding:12px}}
</style>
</head>
<body>
<header class="top"><div class="toprow"><div class="brand"><h1>日本語 Master Deck</h1><small id="saveState">Curate safely — changes stay in this browser</small></div><div class="actions"><label class="fileBtn">Import file<input id="importFile" type="file" accept=".js,.json,application/json,text/javascript"></label><button id="reset">Discard changes</button><button id="add">＋ Add card</button><button class="primary" id="export">Export deck</button></div></div></header>
<main>
  <section class="stats"><div class="stat"><b id="total">0</b> cards</div><div class="stat"><b id="included">0</b> included</div><div class="stat"><b id="excluded">0</b> excluded</div><div class="stat"><b id="edited">0</b> changed</div></section>
  <section class="filters"><input id="search" class="search" type="search" placeholder="Search word, reading, category, or forbidden words…"><select id="category"><option value="">All categories</option></select><select id="status"><option value="all">Included + excluded</option><option value="included">Included only</option><option value="excluded">Excluded only</option><option value="changed">Changed only</option></select><label class="check"><input id="problems" type="checkbox"> Needs attention</label><select id="pageSize"><option>25</option><option selected>50</option><option>100</option></select></section>
  <div class="head"><span>Use</span><span>Word</span><span>Reading</span><span>English</span><span>Level</span><span>Category</span><span>5 forbidden words</span><span></span></div>
  <section id="deck" class="deck"></section><nav class="pager"><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button></nav>
</main><div id="toast"></div>
<script src="japanese-master.js"></script>
<script>
(()=>{"use strict";
const STORAGE="taboo-ja-curation-v2", base=(window.ANKI_DECK_JA||[]).map(normalize), byId=new Map(base.map((c,i)=>[key(c,i),c]));
let changes={}, removed={}, additions=[], page=1, filtered=[];
const $=id=>document.getElementById(id), deck=$("deck"), search=$("search"), category=$("category"), status=$("status"), problems=$("problems"), pageSize=$("pageSize");
function normalize(c){return {w:String(c.w||"").trim(),r:String(c.r||"").trim(),e:String(c.e||"").trim(),d:Math.max(1,Math.min(5,Number(c.d)||3)),c:String(c.c||"未分類").trim(),ng:(Array.isArray(c.ng)?c.ng.map(String):String(c.ng||"").split(/[,、]/)).map(x=>x.trim()).filter(Boolean).slice(0,5)} }
function key(c,i){return `${i}:${c.w}`}
function all(){return base.map((c,i)=>({id:key(c,i),...c,...(changes[key(c,i)]||{}),new:false})).concat(additions.map(c=>({...c,new:true})))}
function isProblem(c){return !c.w||!c.r||!c.e||!c.c||c.ng.length!==5||c.ng.some(x=>/[A-Za-z]/.test(x)||x===c.w||x===c.r||x.includes(c.w)||c.w.includes(x))||new Set(c.ng).size!==5}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s){changes=s.changes||{};removed=s.removed||{};additions=(s.additions||[]).map(normalize).map((c,i)=>({...c,id:`new:${Date.now()}:${i}`}))}}catch(e){toast("Could not restore saved work")}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({changes,removed,additions}));$("saveState").textContent="Saved locally just now";$("saveState").className="dirty"}catch(e){$("saveState").textContent="Browser storage is full — export now to keep changes";$("saveState").className="dirty"}}
function refreshCategories(){const current=category.value,cats=[...new Set(all().map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));category.innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option ${x===current?"selected":""}>${esc(x)}</option>`).join("")}
function apply(){const q=search.value.trim().toLocaleLowerCase(), s=status.value;filtered=all().filter(c=>{const out=!!removed[c.id],changed=c.new||out||!!changes[c.id];if(s==="included"&&out||s==="excluded"&&!out||s==="changed"&&!changed)return false;if(category.value&&c.c!==category.value)return false;if(problems.checked&&!isProblem(c))return false;return !q||[c.w,c.r,c.e,c.c,...c.ng].join(" ").toLocaleLowerCase().includes(q)});const pages=Math.max(1,Math.ceil(filtered.length/Number(pageSize.value)));page=Math.min(page,pages);render(pages);stats()}
function render(pages){const size=Number(pageSize.value), rows=filtered.slice((page-1)*size,page*size);deck.innerHTML=rows.length?rows.map(cardHtml).join(""):'<div class="empty">No cards match these filters.</div>';$("page").textContent=`Page ${page} of ${pages} · ${filtered.length.toLocaleString()} results`;$("prev").disabled=page<=1;$("next").disabled=page>=pages}
function cardHtml(c){return `<article class="card ${removed[c.id]?"excluded":""}" data-id="${esc(c.id)}"><input class="toggle" data-field="use" type="checkbox" title="Include in export" ${removed[c.id]?"":"checked"}><input data-field="w" value="${esc(c.w)}" aria-label="Word"><input data-field="r" value="${esc(c.r)}" aria-label="Reading"><input data-field="e" value="${esc(c.e)}" aria-label="English translation"><select data-field="d" aria-label="Level">${[1,2,3,4,5].map(n=>`<option ${n===c.d?"selected":""}>${n}</option>`).join("")}</select><input data-field="c" value="${esc(c.c)}" aria-label="Category"><input class="wide" data-field="ng" value="${esc(c.ng.join(", "))}" aria-label="Forbidden words"><button class="remove" title="Delete card">×</button></article>`}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function update(id,field,value){const added=additions.find(x=>x.id===id);value=field==="d"?Number(value):field==="ng"?value.split(/[,、]/).map(x=>x.trim()).filter(Boolean):value.trim();if(added)added[field]=value;else {const original=byId.get(id);changes[id]={...(changes[id]||{}),[field]:value};if(JSON.stringify({...original,...changes[id]})===JSON.stringify(original))delete changes[id]}save();stats()}
function stats(){const cards=all(),out=cards.filter(x=>removed[x.id]).length;$("total").textContent=cards.length.toLocaleString();$("included").textContent=(cards.length-out).toLocaleString();$("excluded").textContent=out.toLocaleString();$("edited").textContent=(Object.keys(changes).length+Object.keys(removed).length+additions.length).toLocaleString()}
function toast(msg){const t=$("toast");t.textContent=msg;t.className="show";setTimeout(()=>t.className="",2200)}
deck.addEventListener("change",e=>{const row=e.target.closest(".card");if(!row)return;const id=row.dataset.id,field=e.target.dataset.field;if(field==="use"){if(e.target.checked)delete removed[id];else removed[id]=true;save();apply()}else if(field){update(id,field,e.target.value);if(field==="c")refreshCategories()}});
deck.addEventListener("click",e=>{if(!e.target.classList.contains("remove"))return;const id=e.target.closest(".card").dataset.id;if(id.startsWith("new:"))additions=additions.filter(x=>x.id!==id);else removed[id]=true;save();apply()});
[search,category,status,problems,pageSize].forEach(x=>x.addEventListener(x===search?"input":"change",()=>{page=1;apply()}));
$("prev").onclick=()=>{page--;apply();scrollTo({top:150,behavior:"smooth"})};$("next").onclick=()=>{page++;apply();scrollTo({top:150,behavior:"smooth"})};
$("add").onclick=()=>{const c={id:`new:${Date.now()}`,w:"",r:"",e:"",d:3,c:category.value||"未分類",ng:[],new:true};additions.unshift(c);save();search.value="";status.value="all";problems.checked=false;page=1;refreshCategories();apply();setTimeout(()=>deck.querySelector('[data-field="w"]')?.focus())};
$("reset").onclick=()=>{if(!confirm("Discard all edits, additions, and exclusions saved in this browser?"))return;changes={};removed={};additions=[];localStorage.removeItem(STORAGE);refreshCategories();apply();toast("Changes discarded")};
$("export").onclick=()=>{const cards=all().filter(c=>!removed[c.id]).map(({id,new:n,...c})=>normalize(c));const invalid=cards.filter(isProblem).length;if(invalid){alert(`${invalid} included cards do not have exactly five unique forbidden words. Use “Needs attention” to fix them before exporting.`);return}const body="/* Curated Japanese master deck. */\nwindow.ANKI_DECK_JA=[\n"+cards.map(JSON.stringify).join(",\n")+"\n];\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body],{type:"text/javascript;charset=utf-8"}));a.download="japanese-master.js";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`Exported ${cards.length.toLocaleString()} cards`)};
$("importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{let text=await file.text(),data;if(file.name.endsWith(".json"))data=JSON.parse(text);else{const match=text.match(/(?:window\.)?ANKI_DECK_JA\s*=\s*(\[[\s\S]*\])\s*;?\s*$/);if(!match)throw Error("No ANKI_DECK_JA array found");data=JSON.parse(match[1])}if(!Array.isArray(data))throw Error("Deck is not an array");additions=data.map(normalize).map((c,i)=>({...c,id:`new:${Date.now()}:${i}`,new:true}));changes={};removed=Object.fromEntries(base.map((c,i)=>[key(c,i),true]));save();refreshCategories();apply();toast(`Imported ${data.length.toLocaleString()} cards`)}catch(err){alert("Could not import deck: "+err.message)}finally{e.target.value=""}};
load();refreshCategories();apply();
})();
</script>
</body></html>
