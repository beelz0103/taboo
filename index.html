/* ================= THEMES =================
   every colour in this sheet comes from these tokens, so a skin is
   just one block of overrides. :root = CLASSIC.
   --pop / --pop-ink : accent that sits on the GROUND (buttons, pills, bars)
   --mark / --mark-hi: accent that sits on a CARD (kickers, rules, pips)
   --ink / --ink-on  : the deepest surface (card band, dark buttons) + its text
========================================== */
:root{
  --ground:#D40D2A; --ground-2:#9E0A20; --glow-top:rgba(255,255,255,.10);
  --on:#FFFFFF; --on-soft:rgba(255,255,255,.72); --on-line:rgba(255,255,255,.28);
  --ink:#121212; --ink-on:#FFFFFF;
  --pop:#FFFFFF; --pop-2:#EFDCDF; --pop-ink:#121212;
  --mark:#D40D2A; --mark-hi:#A2545F; --reading:#FF9AA4;
  --hi:#FFD400; --flash:#FFD400;
  --card:#FFFFFF; --card-alt:#FBE7EA; --card-ink:#141414; --card-body:#2B2B2B;
  --card-sub:#9A9A9A; --card-line:rgba(0,0,0,.14); --sheen:rgba(0,0,0,0);
  --deck-1:rgba(255,255,255,.28); --deck-2:rgba(255,255,255,.16);
  --buzz-1:#FF7A6E; --buzz-2:#E01228; --buzz-3:#8E0416;
  --drop:rgba(0,0,0,.45); --glow:0 0 0 rgba(0,0,0,0);
  --seam:rgba(0,0,0,.05); --panel:rgba(0,0,0,.22); --bar-bg:rgba(0,0,0,.32);
  --plaque-bg:#FFFFFF; --plaque-ink:#D40D2A; --plaque-line:#121212;
}
:root[data-skin="neon"]{
  --ground:#0C0B18; --ground-2:#050409; --glow-top:rgba(0,229,255,.18);
  --on:#EAF6FF; --on-soft:rgba(234,246,255,.60); --on-line:rgba(0,229,255,.28);
  --ink:#07060E; --ink-on:#EAF6FF;
  --pop:#00E5FF; --pop-2:#0091AD; --pop-ink:#04121A;
  --mark:#FF2FB9; --mark-hi:#FF87D8; --reading:#00E5FF;
  --hi:#FFE83D; --flash:#FF2FB9;
  --card:#100F1E; --card-alt:#1A1936; --card-ink:#F2F7FF; --card-body:#C6D2E8;
  --card-sub:#6F7BA0; --card-line:rgba(0,229,255,.26); --sheen:rgba(0,229,255,.12);
  --deck-1:#1B1A36; --deck-2:#131226;
  --buzz-1:#FF9AE0; --buzz-2:#FF2FB9; --buzz-3:#77004F;
  --drop:#001A22; --glow:0 0 22px rgba(0,229,255,.30);
  --seam:rgba(0,0,0,.34); --panel:rgba(0,0,0,.34); --bar-bg:rgba(0,0,0,.5);
  --plaque-bg:#07060E; --plaque-ink:#00E5FF; --plaque-line:#FF2FB9;
}
:root[data-skin="poison"]{
  --ground:#1A0A2E; --ground-2:#06010B; --glow-top:rgba(177,75,255,.26);
  --on:#F0E2FF; --on-soft:rgba(240,226,255,.60); --on-line:rgba(183,109,255,.32);
  --ink:#0B0413; --ink-on:#F6ECFF;
  --pop:#B14BFF; --pop-2:#7A18C9; --pop-ink:#12001F;
  --mark:#C471FF; --mark-hi:#E9B6FF; --reading:#E9B6FF;
  --hi:#C6FF3D; --flash:#B14BFF;
  --card:#170A24; --card-alt:#220E36; --card-ink:#F3E7FF; --card-body:#DCC9EE;
  --card-sub:#8E6BB5; --card-line:rgba(177,75,255,.32); --sheen:rgba(177,75,255,.14);
  --deck-1:#2C1042; --deck-2:#1E0A2E;
  --buzz-1:#E9B6FF; --buzz-2:#A21CF0; --buzz-3:#4A0A7A;
  --drop:#2A0842; --glow:0 0 24px rgba(177,75,255,.34);
  --seam:rgba(0,0,0,.3); --panel:rgba(0,0,0,.3); --bar-bg:rgba(0,0,0,.45);
  --plaque-bg:#0B0413; --plaque-ink:#B14BFF; --plaque-line:#B14BFF;
}
:root[data-skin="midnight"]{
  --ground:#141C3A; --ground-2:#070B1B; --glow-top:rgba(255,199,102,.14);
  --on:#F2F4FF; --on-soft:rgba(242,244,255,.62); --on-line:rgba(255,255,255,.24);
  --ink:#0B1027; --ink-on:#FFF8EA;
  --pop:#FFC766; --pop-2:#D89A2E; --pop-ink:#1B1405;
  --mark:#1E3A9E; --mark-hi:#8A6A28; --reading:#FFC766;
  --hi:#FFE083; --flash:#FFC766;
  --card:#FBF6EC; --card-alt:#F0E6D4; --card-ink:#171A2B; --card-body:#3A3F55;
  --card-sub:#9A9583; --card-line:rgba(0,0,0,.14); --sheen:rgba(0,0,0,0);
  --deck-1:rgba(255,255,255,.26); --deck-2:rgba(255,255,255,.13);
  --buzz-1:#FFE1A6; --buzz-2:#E8A33A; --buzz-3:#7A4E08;
  --drop:rgba(0,0,0,.5); --glow:0 0 20px rgba(255,199,102,.18);
  --seam:rgba(0,0,0,.05); --panel:rgba(0,0,0,.3); --bar-bg:rgba(0,0,0,.4);
  --plaque-bg:#FBF6EC; --plaque-ink:#1E3A9E; --plaque-line:#FFC766;
}
:root[data-skin="washi"]{
  --ground:#EFE8DC; --ground-2:#D9CDBA; --glow-top:rgba(255,255,255,.55);
  --on:#1E1A16; --on-soft:rgba(30,26,22,.60); --on-line:rgba(30,26,22,.22);
  --ink:#171310; --ink-on:#F7F2E8;
  --pop:#C8102E; --pop-2:#8E0A1F; --pop-ink:#FFF6EE;
  --mark:#C8102E; --mark-hi:#8A6A3A; --reading:#E8A0A8;
  --hi:#C8102E; --flash:#C8102E;
  --card:#FCF8F0; --card-alt:#F2E7D6; --card-ink:#171310; --card-body:#3B332B;
  --card-sub:#A2937E; --card-line:rgba(23,19,16,.16); --sheen:rgba(0,0,0,0);
  --deck-1:rgba(23,19,16,.16); --deck-2:rgba(23,19,16,.08);
  --buzz-1:#FF9A8E; --buzz-2:#C8102E; --buzz-3:#6E0413;
  --drop:rgba(23,19,16,.30); --glow:0 0 0 rgba(0,0,0,0);
  --seam:rgba(23,19,16,.05); --panel:rgba(23,19,16,.07); --bar-bg:rgba(23,19,16,.18);
  --plaque-bg:#171310; --plaque-ink:#F7F2E8; --plaque-line:#C8102E;
}
/* swatches in the picker keep their own colours whatever the active skin */
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.skins button{
  display:flex;flex-direction:column;gap:6px;align-items:stretch;
  padding:7px 7px 8px;border:2px solid var(--on-line);border-radius:8px;
  background:transparent;color:var(--on-soft);cursor:pointer;font-weight:900;
  font-size:9.5px;letter-spacing:.1em;min-height:44px;
}
.skins button[aria-pressed="true"]{border-color:var(--pop);color:var(--on);box-shadow:var(--glow)}
.skins button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.skins .sw{display:block;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.28)}
.sw-classic {background:linear-gradient(90deg,#D40D2A 0 46%,#FFFFFF 46% 76%,#121212 76% 100%)}
.sw-neon    {background:linear-gradient(90deg,#0C0B18 0 40%,#00E5FF 40% 72%,#FF2FB9 72% 100%)}
.sw-poison  {background:linear-gradient(90deg,#1A0A2E 0 42%,#B14BFF 42% 74%,#C6FF3D 74% 100%)}
.sw-midnight{background:linear-gradient(90deg,#141C3A 0 44%,#FFC766 44% 74%,#FBF6EC 74% 100%)}
.sw-washi   {background:linear-gradient(90deg,#EFE8DC 0 44%,#C8102E 44% 74%,#171310 74% 100%)}

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100%;min-height:100dvh;
  background:var(--ground);
  background-image:
    radial-gradient(120% 80% at 50% -15%, var(--glow-top) 0%, rgba(0,0,0,0) 62%),
    radial-gradient(130% 95% at 50% 0%, var(--ground) 0%, var(--ground-2) 100%);
  background-attachment:fixed;
  color:var(--on);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-weight:700;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  display:flex;justify-content:center;
  padding:18px 18px calc(26px + env(safe-area-inset-bottom));
}
.app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.en{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.06em}
button{touch-action:manipulation;font-family:inherit}
.screen{display:flex;flex-direction:column;gap:14px}
#menu{gap:18px}
[hidden]{display:none !important}

/* --- top bar --- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 2px}
.lang{display:flex;border:2px solid var(--on-line);border-radius:999px;overflow:hidden}
.lang button{
  font-family:"Anton",sans-serif;font-size:12px;letter-spacing:.1em;
  background:none;border:0;color:var(--on-soft);padding:7px 12px;cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--pop);color:var(--pop-ink)}
.lang button:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.linkbtn{
  background:none;border:0;color:var(--on-soft);cursor:pointer;
  font-weight:700;font-size:13px;letter-spacing:.06em;
  text-decoration:underline;text-underline-offset:4px;padding:8px 4px;
}

/* --- logo --- */
.logo{display:inline-flex;flex-direction:column;align-items:center;gap:6px;align-self:center;margin:2vh 0 0}
.plaque{
  background:var(--plaque-bg);color:var(--plaque-ink);
  font-size:clamp(52px,17vw,86px);font-weight:900;line-height:1.1;
  padding:14px 26px 18px;border-radius:14px;
  border:5px solid var(--plaque-line);
  box-shadow:8px 8px 0 var(--drop), var(--glow);
  transform:rotate(-2.5deg);letter-spacing:.04em;
}
.logo .sub{
  font-family:"Anton",sans-serif;font-size:clamp(15px,4.4vw,20px);
  letter-spacing:.52em;padding-left:.52em;color:var(--on);margin-top:10px;
}
.tagline{text-align:center;color:var(--on-soft);font-size:13px;letter-spacing:.04em;line-height:1.7;margin:0}

/* --- buttons --- */
.btn{
  font-weight:900;font-size:19px;
  border:2px solid var(--on-line);border-radius:10px;cursor:pointer;padding:16px 18px;
  background:var(--ink);color:var(--ink-on);box-shadow:0 5px 0 var(--drop);
  transition:transform .07s ease,box-shadow .07s ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--drop)}
.btn:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.btn-light{
  background:linear-gradient(180deg,var(--pop) 0%,var(--pop-2) 100%);
  color:var(--pop-ink);border-color:transparent;box-shadow:0 5px 0 var(--drop),var(--glow);
}
.btn-ghost{background:transparent;color:var(--on);border:3px solid var(--on-line);box-shadow:none}
.btn-ghost:active{transform:translateY(2px)}

.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;letter-spacing:.2em;color:var(--on-soft);font-weight:900}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;font-weight:900;font-size:14px;padding:12px 2px;min-height:44px;
  border:2px solid var(--on-line);border-radius:8px;background:transparent;color:var(--on-soft);
  cursor:pointer;font-variant-numeric:tabular-nums;
}
.seg button[aria-pressed="true"]{background:var(--pop);color:var(--pop-ink);border-color:var(--pop);box-shadow:var(--glow)}
.seg button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.count{text-align:center;font-size:12px;color:var(--on-soft);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.links{display:flex;flex-direction:column;gap:2px;align-items:center;padding-top:2px}

/* --- language gate --- */
.gate{display:flex;flex-direction:column;gap:20px;text-align:center;min-height:calc(100dvh - 36px);justify-content:center}
.gate .logo{margin:0}
.gate .ask{font-size:12.5px;letter-spacing:.14em;color:var(--on-soft);line-height:2.1;margin:0}
.gate .ask .en{display:block;font-size:12px;letter-spacing:.2em}
.pick{display:flex;flex-direction:column;gap:11px}
.pick .btn{display:flex;flex-direction:column;align-items:center;gap:5px}
.pick .btn .big{font-size:23px;line-height:1.1}
.pick .btn .small{font-family:"Anton",sans-serif;font-size:10.5px;letter-spacing:.22em;opacity:.72;font-weight:400}

/* --- rules --- */
.sheet{
  background:var(--card);color:var(--card-ink);border-radius:14px;
  padding:26px 22px;border:2px solid var(--card-line);
  box-shadow:0 8px 0 var(--drop),var(--glow);
  display:flex;flex-direction:column;gap:22px;
}
.sheet-head{display:flex;flex-direction:column;gap:7px}
/* on the ground use the ground-contrast colour; --mark is a colour for CARDS
   and in CLASSIC it is literally the ground colour (invisible red on red) */
.kicker{font-family:"Anton",sans-serif;font-size:11px;letter-spacing:.26em;color:var(--on-soft);line-height:1}
.sheet .kicker{color:var(--mark)}
.rd-team{color:var(--mark)}
.sheet h2{font-size:24px;margin:0;font-weight:900;line-height:1.25}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.steps li{
  display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;
  font-size:15px;line-height:1.75;font-weight:500;color:var(--card-body);
}
.steps li::before{
  counter-increment:s;content:counter(s);
  font-family:"Anton",sans-serif;font-size:15px;line-height:26px;text-align:center;
  background:var(--mark);color:#fff;border-radius:6px;height:26px;width:28px;
}
.steps li > span{min-width:0}
.steps b{font-weight:900;color:var(--card-ink)}
.scoreblock{background:var(--card-alt);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.scoreblock .kicker{color:var(--mark-hi)}
.scoring{display:flex;flex-direction:column;gap:7px}
.scoring div{display:flex;justify-content:space-between;align-items:baseline;font-size:14.5px;font-weight:700}
.scoring span{font-weight:900;color:var(--mark);font-variant-numeric:tabular-nums}
.note{margin:0;font-size:12.5px;line-height:1.8;color:var(--card-sub);font-weight:500;border-top:2px solid var(--card-alt);padding-top:18px}

/* --- hud --- */
.hud{display:flex;flex-direction:column;gap:9px}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:"Anton",Impact,sans-serif;font-size:38px;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock.low{color:var(--hi)}
.tally{display:flex;gap:14px;align-items:baseline;font-size:11px;letter-spacing:.14em;color:var(--on-soft)}
.tally b{font-family:"Anton",sans-serif;font-size:23px;color:var(--on);letter-spacing:0;margin-left:5px}
.bar{height:7px;border-radius:99px;background:var(--bar-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pop);transform-origin:left center;transition:transform 1s linear,background .2s}
.bar i.low{background:var(--hi)}

/* --- the card: 4 words per card, two ends per face --- */
.deck{position:relative;perspective:1200px}
.deck::before,.deck::after{
  content:"";position:absolute;inset:8px -6px -10px;border-radius:16px;
  background:var(--deck-1);z-index:0;
}
.deck::after{inset:14px -12px -18px;background:var(--deck-2)}
.card{
  position:relative;z-index:1;background:var(--card);color:var(--card-ink);
  border-radius:16px;overflow:hidden;border:2px solid var(--card-line);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.6),var(--glow);
  display:flex;flex-direction:column;min-height:min(50dvh,392px);
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 60% at 50% 0%,var(--sheen),rgba(0,0,0,0) 60%);
}
.side{display:flex;flex-direction:column;min-height:0}
.side-a{flex:1 1 auto}
.side-b{flex:0 0 auto;transform:rotate(180deg);opacity:.4}
.band{background:var(--ink);padding:18px 16px 16px;text-align:center;border-bottom:5px solid var(--mark);position:relative}
.side-b .band{padding:11px 14px 10px;border-bottom-width:3px}
.reading{font-size:12px;letter-spacing:.22em;color:var(--reading);font-weight:700;min-height:15px;margin-bottom:5px}
.side-b .reading{font-size:10px;min-height:0;margin-bottom:2px}
.target{
  margin:0;color:var(--ink-on);font-weight:900;line-height:1.12;
  font-size:clamp(30px,8.6vw,46px);letter-spacing:.02em;text-wrap:balance;
}
.side-b .target{font-size:clamp(17px,4.6vw,22px)}
.ng{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;min-height:0}
.ng li{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:clamp(17px,5vw,22px);font-weight:900;letter-spacing:.02em;
  padding:8px 12px;text-align:center;min-height:40px;
}
.ng li:nth-child(odd){background:var(--card-alt)}
.side-b .ng{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:0 10px;padding:5px 12px 7px}
.side-b .ng li{flex:0 0 auto;min-height:0;padding:1px 0;font-size:11.5px;font-weight:700;background:none !important;color:var(--card-sub)}
/* the fold between the two ends */
.seam{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 12px;font-size:9.5px;letter-spacing:.13em;color:var(--card-sub);font-weight:700;
  border-top:2px dashed var(--card-line);border-bottom:2px dashed var(--card-line);
  background:var(--seam);
}
.seam .no{font-family:"Anton",sans-serif;letter-spacing:.1em;white-space:nowrap}
.seam .meta{text-align:right;min-width:0}
.pips{display:flex;gap:4px;align-items:center;flex:none}
.pips i{width:12px;height:4px;border-radius:2px;background:var(--card-line)}
.pips i.on{background:var(--mark)}
/* turn-the-card affordance */
.turn{
  position:absolute;top:8px;right:8px;z-index:3;
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  background:rgba(0,0,0,.35);border:1.5px solid var(--card-line);color:var(--ink-on);
  font-size:17px;line-height:1;display:grid;place-items:center;
}
.turn:active{transform:scale(.92)}
.turn:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.deal{animation:deal .22s cubic-bezier(.2,.75,.3,1)}
@keyframes deal{from{opacity:0;transform:translateY(-14px) rotate(1.2deg) scale(.97)}to{opacity:1;transform:none}}
.spin{animation:spin .34s cubic-bezier(.3,.7,.2,1)}
@keyframes spin{from{transform:rotate(-180deg) scale(.94)}to{transform:none}}
.flip{animation:flip .38s cubic-bezier(.3,.7,.2,1)}
@keyframes flip{from{transform:rotateY(-180deg) scale(.94)}to{transform:none}}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-1deg)}50%{transform:translateX(8px) rotate(1deg)}80%{transform:translateX(-4px)}}

/* --- actions --- */
.actions{display:flex;flex-direction:column;gap:9px}
.arow{display:flex;gap:9px;align-items:stretch}
.arow .btn{flex:1;font-size:21px}
.buzzer{flex:none;width:var(--bz,78px);border:0;background:none;padding:0;cursor:pointer;transition:transform .07s ease}
.buzzer:active{transform:translateY(4px)}
.buzzer:focus-visible{outline:3px solid var(--hi);outline-offset:3px;border-radius:50%}
.buzzer i{
  display:grid;place-items:center;width:var(--bz,78px);height:var(--bz,78px);border-radius:50%;
  background:var(--ink);box-shadow:0 5px 0 var(--drop),var(--glow);
}
.buzzer i::before{
  content:attr(data-buzz);width:calc(var(--bz,78px) - 18px);height:calc(var(--bz,78px) - 18px);
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%,var(--buzz-1),var(--buzz-2) 56%,var(--buzz-3));
  color:#fff;font-size:11px;font-weight:900;letter-spacing:.06em;
  display:grid;place-items:center;font-style:normal;text-align:center;
  box-shadow:inset 0 -3px 7px rgba(0,0,0,.45);
}
.hint{text-align:center;font-size:11px;color:var(--on-soft);letter-spacing:.08em;font-weight:500;line-height:1.8}

/* --- end --- */
.end{display:flex;flex-direction:column;gap:16px;text-align:center;padding-top:1vh}
.bigscore{
  font-family:"Anton",Impact,sans-serif;font-size:clamp(58px,17vw,96px);
  line-height:1.22;margin:8px 0 0;color:var(--pop);
}
.end .label{margin-bottom:2px}
.scoreline{display:flex;flex-direction:column;gap:0}
.breakdown{display:flex;justify-content:center;gap:26px;font-size:11px;letter-spacing:.14em;color:var(--on-soft)}
.breakdown b{display:block;font-family:"Anton",sans-serif;font-size:26px;color:var(--on);letter-spacing:0;margin-top:4px}
.missed{
  text-align:left;background:var(--panel);border:1px solid var(--on-line);border-radius:10px;
  padding:14px 16px;font-size:13px;line-height:1.9;color:var(--on-soft);font-weight:500;
}
.missed b{display:block;font-size:10px;letter-spacing:.18em;color:var(--on);margin-bottom:6px}

/* --- companions: buzzer + scorekeeper --- */
.pane{display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 76px)}
.pane-hint{margin:0;text-align:center;font-size:12px;line-height:1.9;color:var(--on-soft);font-weight:500}
.pad{flex:1;display:grid;place-items:center;padding:4px 0}
.bz-btn{
  width:min(74vw,300px);aspect-ratio:1;border-radius:50%;border:3px solid var(--on-line);
  padding:0;cursor:pointer;background:var(--ink);display:grid;place-items:center;
  box-shadow:0 12px 0 var(--drop),var(--glow);
  transition:transform .07s ease,box-shadow .07s ease;
}
.bz-btn:active{transform:translateY(10px);box-shadow:0 2px 0 var(--drop),var(--glow)}
.bz-btn:focus-visible{outline:4px solid var(--hi);outline-offset:4px}
.bz-btn span{
  width:84%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 26%,var(--buzz-1),var(--buzz-2) 52%,var(--buzz-3));
  color:#fff;font-weight:900;font-size:clamp(26px,9vw,44px);letter-spacing:.04em;
  box-shadow:inset 0 -10px 20px rgba(0,0,0,.4);
}
.pane-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.seat.away{opacity:.5}

/* --- the link bar: room code + connection --- */

      playEl=$("play"), endEl=$("end"), finalEl=$("final"), joinEl=$("join"), lobbyEl=$("lobby"),

/* the table: seats in order, 1 2 1 2 ... — your number is your team */
const S = {
  seats:[], tnames:["",""],
  turnIdx:0, judgePick:null,

const teamOf   = i => i % 2;
const seatName = i => (S.seats[i] && S.seats[i].name) || "";
/* Only the game master's explicit AFK choice removes somebody from rotation.
   Mobile browsers throttle timers in the background, so connection silence is
   not reliable evidence that a player has actually left. */
const away     = p => !!(p && p.afk);
/* the judge is the next seat along that is actually present */
const judgeIdx = () => {
  if(S.judgePick!=null) return S.judgePick;
  const n=S.seats.length;
  if(n<2) return S.turnIdx;
  for(let k=1;k<n;k++){ const i=(S.turnIdx+k)%n; if(!away(S.seats[i])) return i; }
  return (S.turnIdx+1)%n;
};
const teamName = t => (S.tnames[t] || "").trim() || T.teamNum(t+1);

      S:{seats:S.seats, tnames:S.tnames, turnIdx:S.turnIdx, laps:S.laps, lap:S.lap,

}

function localDay(){
  const d=new Date(), z=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function playedStoreKey(day, room){ return "taboo.played."+day+"."+(room||"local"); }
function loadPlayed(){
  playedDay=localDay(); playedCards=new Set();
  try{
    const a=JSON.parse(localStorage.getItem(playedStoreKey(playedDay,Net.room))||"[]");
    if(Array.isArray(a)) a.forEach(k=>playedCards.add(String(k)));
  }catch(e){}
}
function savePlayed(){
  try{ localStorage.setItem(playedStoreKey(playedDay,Net.room),JSON.stringify([...playedCards])); }catch(e){}
}
function cardKey(c){
  const s=deckLang+"|"+String(c&&c.w||"");
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return deckLang+":"+(h>>>0).toString(36);
}
function rememberPlayed(key, day, broadcast){
  day=day||localDay();
  if(day!==playedDay){
    if(day===localDay()) loadPlayed();
    else{
      /* Keep the room host's dated marker on every player's device even when
         their phone happens to be in another time zone. */
      try{
        const storageKey=playedStoreKey(day,Net.room);
        const old=JSON.parse(localStorage.getItem(storageKey)||"[]");
        const set=new Set(Array.isArray(old)?old:[]);
        if(key) set.add(String(key));
        localStorage.setItem(storageKey,JSON.stringify([...set]));
      }catch(e){}
      return;
    }
  }
  key=String(key||""); if(!key || playedCards.has(key)) return;
  playedCards.add(key); savePlayed();
  if(broadcast) post({t:"played",day,key});
}
function buildPool(){
  if(playedDay!==localDay()) loadPlayed();
  pool = DECK.filter(c=>(!level || c.d===level) && !playedCards.has(cardKey(c)));
}
function updateCount(){
  buildPool();
  $("deckCount").textContent = T.countFmt(Math.floor(pool.length/PER_CARD), pool.length);
}

/* ---------- sound ---------- */
let ac=null;
function tone(freqs, dur, type, vol){
  if(!sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
    g.connect(ac.destination);
    freqs.forEach(f=>{
      const o = ac.createOscillator();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime);
      o.connect(g); o.start(); o.stop(ac.currentTime+dur);
    });
  }catch(e){}
}
const sBuzz = ()=>tone([150,98], .45, "square", .18);
const sOk   = ()=>tone([880,1320], .1, "triangle", .12);
const sEnd  = ()=>tone([130,86], .9, "sawtooth", .2);
$("soundBtn").onclick = ()=>{ sound=!sound; $("soundBtn").textContent = sound?T.soundOn:T.soundOff; save(); };
function flash(){ const f=$("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function buzzFeedback(){
  sBuzz(); flash();
  if(navigator.vibrate) try{ navigator.vibrate([90,45,150]); }catch(e){}
}

/* ---------- cards: four words each ---------- */
function shuffle(a){
  const c=a.slice();
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}
  return c;
}
function newQueue(){
  buildPool();
  const sh = shuffle(pool), out = [];
  for(let i=0;i+PER_CARD<=sh.length;i+=PER_CARD) out.push(sh.slice(i,i+PER_CARD));
  if(!out.length && sh.length) out.push(Array.from({length:PER_CARD},(_,k)=>sh[k%sh.length]));
  return out;
}
function paint(){
  if(!hand) return;
  current = hand[slot];
  if(!current) return;
  rememberPlayed(cardKey(current), localDay(), true);
  const other = hand[slot ^ 1];
  $("reading").textContent  = current.r;
  $("target").textContent   = current.w;
  $("ngList").innerHTML     = current.ng.map(x=>`<li>${esc(x)}</li>`).join("");
  $("reading2").textContent = other.r;
  $("target2").textContent  = other.w;
  $("ngList2").innerHTML    = other.ng.map(x=>`<li>${esc(x)}</li>`).join("");
  $("cardNo").textContent   = "NO." + String(cardNo).padStart(3,"0");
  $("cardMeta").textContent = (slot<2 ? T.faceA : T.faceB) + " · " +
                              (T.cats[current.c] || current.c) + " · " + T.lvlName[current.d];
  $("pips").innerHTML = [0,1,2,3].map(i=>`<i class="${i===slot?"on":""}"></i>`).join("");
  pushState();
}
function animate(a){
  const el = $("card");
  el.classList.remove("deal","spin","flip","shake");
  void el.offsetWidth;
  el.classList.add(a);
}
function deal(anim){
  if(!queue.length) queue = newQueue();
  hand = queue.pop(); slot = 0; cardNo++;
  paint(); animate(anim || "deal");
}
function advance(anim){
  if(!hand) return deal(anim);
  if(slot >= PER_CARD-1) return deal(anim || "deal");
  slot++; paint();
  animate(anim || (slot === 2 ? "flip" : "spin"));
}
/* what your hand does to a real card — no points */
function turn(){ if(!playEl.hidden) advance(); }

/* ---------- the hourglass ---------- */
const HG_H = 24;
function hourglass(frac, low){
  frac = Math.max(0, Math.min(1, frac));
  const top=$("hgTop"), bot=$("hgBot");
  top.setAttribute("y", (32 - HG_H*frac).toFixed(2));
  top.setAttribute("height", (HG_H*frac).toFixed(2));
  bot.setAttribute("y", (60 - HG_H*(1-frac)).toFixed(2));
  bot.setAttribute("height", (HG_H*(1-frac)).toFixed(2));
  $("hgStream").style.opacity = (frac>0 && frac<1) ? "1" : "0";
  $("hg").classList.toggle("low", !!low);
}
function flipHourglass(){
  const rects=[$("hgTop"),$("hgBot")], hg=$("hg");
  rects.forEach(r=>r.style.transition="none");
  hourglass(1,false);
  hg.classList.remove("turned"); hg.getBoundingClientRect(); hg.classList.add("turned");
  requestAnimationFrame(()=>rects.forEach(r=>r.style.transition=""));
}

/* ---------- screens ---------- */
let backTo=null;
function show(sec){
  if(sec===setEl){ const cur=SCREENS.find(x=>!x.hidden); if(cur && cur!==setEl) backTo=cur; }
  SCREENS.forEach(s=>s.hidden = s!==sec);
  $("topbar").hidden = sec===gateEl;
  $("netbar").hidden = (sec===gateEl || sec===playEl || sec===setupEl);
  netUI();
  /* a companion screen must not kill a running turn */
  if(sec!==playEl && !COMPANIONS.includes(sec)) clearInterval(timer);
  if(COMPANIONS.includes(sec)) startPing(); else stopPing();
  renderLive();
  applyRole(LS);
  window.scrollTo(0,0);
  pushState();
}
function parseHash(){
  const m = /^#([a-z]+)(?:[=\/]([A-Za-z0-9]+))?/.exec(location.hash || "");
  return m ? {screen:m[1], room:(m[2]||"").toUpperCase()} : {screen:"", room:""};
}
function route(){
  const h = parseHash();
  if(h.room && h.room !== Net.room) Net.connect(h.room);
  if(h.screen === "join"){ picked=true; openJoin(); return; }
  if(h.screen === "buzzer") show(buzzEl);
  else if(h.screen === "judge") show(judgeEl);
  else if(h.screen === "score") show(keepEl);
  else show(picked ? menuEl : gateEl);
}
function goto(hash, el){
  location.hash = Net.room ? hash + "=" + Net.room : hash;
  if(el.hidden) show(el);
}
window.addEventListener("hashchange", route);
function leaveCompanion(){ if(location.hash) location.hash=""; else route(); }

/* ---------- the table ---------- */
function rosterHTML(editable){
  const mayMarkAfk=isHost && !following;
  return S.seats.map((p,i)=>`
    <li class="seat${away(p)?" away":""}">
      <span class="tnum ${i%2?"n2":"n1"}">${i%2+1}</span>
      <span class="snm">${esc(p.name)}${p.id?' <i class="own">●</i>':""}${me&&me.seat===i?' <i class="you">'+T.youTag+'</i>':""}</span>
      <span class="sx">${away(p)?T.afkTag:"#"+(i+1)}</span>
      ${mayMarkAfk?`<button type="button" data-afk="${i}" aria-pressed="${!!p.afk}" title="${T.afkToggle}">${T.afkBtn}</button>`:""}
      ${editable?`<button type="button" data-mine="${i}" aria-label="this is me">${T.meBtn}</button>
      <button type="button" data-up="${i}" aria-label="move up"${i===0?" disabled":""}>↑</button>
      <button type="button" data-del="${i}" aria-label="remove">✕</button>`:""}

const teamSize = t => S.seats.filter((p,i)=>teamOf(i)===t).length;
/* Taboo needs a describer AND someone to describe to, on both sides: 2 per team. */

function addPlayer(){

/* Only the game master may park a player. */
function setAfk(i, on){
  const p=S.seats[i]; if(!p) return;
  p.afk = !!on;
  renderSeats(); if(!readyEl.hidden) paintReady(); save(); pushState();

function rosterClick(e){
  const del=e.target.closest("[data-del]"), up=e.target.closest("[data-up]"),
        afk=e.target.closest("[data-afk]"), mine=e.target.closest("[data-mine]");
  if(afk){
    const i=Number(afk.dataset.afk);
    if(isHost && !following) setAfk(i, !S.seats[i].afk);
    return;
  }
  if(mine){                                  /* "this is me" on the host device */
    const i=Number(mine.dataset.mine);
    me = (me && me.seat===i) ? null : {id:Net.id, name:seatName(i), seat:i};
    if(me && S.seats[i]) S.seats[i].id = Net.id;
    renderSeats(); applyRole(null); save(); pushState();
    return;
  }
  if(del) S.seats.splice(Number(del.dataset.del),1);
  else if(up){ const i=Number(up.dataset.up); if(i>0){ const s=S.seats; [s[i-1],s[i]]=[s[i],s[i-1]]; } }
  else return;
  renderSeats(); save(); pushState();
}
$("seats").addEventListener("click", rosterClick);
$("lobbyList").addEventListener("click", rosterClick);
$("rpNew").onclick = ()=>{

function startSession(){

function paintReady(){

/* the next seat that is present, and whether we went past the end of the table */
function nextSeat(from){
  const n=S.seats.length;
  for(let k=1;k<=n;k++){
    const j=(from+k)%n;
    if(!away(S.seats[j])) return {seat:j, wrapped:(from+k)>=n};
  }
  return null;                       /* everybody is away */
}
function nextTurn(){
  const nx = nextSeat(S.turnIdx);
  if(!nx) return showFinal();
  if(nx.wrapped) S.lap++;
  S.turnIdx = nx.seat;
  if(S.laps && S.lap > S.laps) return showFinal();
  gotoReady();
}
function sessionDone(){
  if(mode!=="session" || !S.laps) return false;
  const nx = nextSeat(S.turnIdx);
  return !nx || (nx.wrapped && S.lap>=S.laps);
}
function showFinal(){
  const [a,b]=S.scores;
  $("winTeam").textContent = a===b ? T.drawLabel : teamName(a>b?0:1);
  $("winScore").textContent = Math.max(a,b);
  $("finBoard").innerHTML = boardHTML(a===b ? -1 : (a>b?0:1));
  const arr = Object.entries(S.stats).sort((x,y)=>y[1].ok-x[1].ok);
  $("mvp").innerHTML = arr.length
    ? T.mvp(esc(arr[0][0]), arr[0][1].ok) + "<br>" + arr.map(([n,s])=>`${esc(n)} ${s.ok}`).join(" · ")
    : "";
  S.active=false; mode="session";
  show(finalEl); save();
}

/* ---------- a turn ---------- */
function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function tick(){
  left--;
  $("clock").textContent = fmt(Math.max(left,0));
  const low = left<=10;
  $("clock").classList.toggle("low", low);
  hourglass(Math.max(left,0)/limit, low);
  pushState();
  if(left<=0){ sEnd(); finish(); }
}
function start(){
  masterCardRevealed=false;
  buildPool();
  queue = newQueue(); hand=null; slot=0; cardNo=0;
  score=0; passes=0; fouls=0; missed=[]; left=limit;
  $("score").textContent=0; $("passes").textContent=0; $("fouls").textContent=0;
  $("clock").textContent = fmt(limit);
  $("clock").classList.remove("low");
  $("nowPlaying").hidden = mode!=="session";
  if(mode==="session"){
    const t=teamOf(S.turnIdx);
    const named = teamName(t) !== T.teamNum(t+1) ? `<span>${esc(teamName(t))}</span>` : "";
    $("nowPlaying").innerHTML =
      `<span class="tag">${T.teamNum(t+1)}</span><b>${esc(seatName(S.turnIdx))}</b>` +
      named + `<span>${T.judgeShort}: ${esc(seatName(judgeIdx()))}</span>`;
  }
  show(playEl); applyRole(null); flipHourglass(); deal();
  clearInterval(timer); timer = setInterval(tick,1000);
}
function finish(){
  clearInterval(timer);
  const pts = score - fouls;
  show(endEl);
  $("finalScore").textContent = pts;
  $("fOk").textContent = score; $("fPass").textContent = passes; $("fBuzz").textContent = fouls;
  if(mode==="session" && S.seats.length){
    const i=S.turnIdx, t=teamOf(i), nm=seatName(i);
    S.scores[t] += pts;
    const st = S.stats[nm] || (S.stats[nm]={ok:0,pass:0,buzz:0,turns:0});
    st.ok+=score; st.pass+=passes; st.buzz+=fouls; st.turns++;
    $("addedTo").hidden=false; $("addedTo").innerHTML = T.addedTo(esc(teamName(t)), pts);
    $("endBoard").hidden=false; $("endBoard").innerHTML = boardHTML(t);
    $("againBtn").textContent = sessionDone() ? T.seeResult : T.nextTurn;
  }else{
    $("addedTo").hidden=true; $("endBoard").hidden=true;
    $("againBtn").textContent = T.again;
    post({t:"round", pts});          /* a standalone scorekeeper can take it */
  }
  const box=$("missed");
  if(missed.length){
    box.hidden=false;
    box.innerHTML = `<b>${T.missedTitle}</b>${missed.map(m=>esc(m.w)).join(lang==="ja"?"、":", ")}`;
  } else box.hidden = true;
  save(); pushState();
}
function registerBuzz(){
  fouls++; missed.push(current); $("fouls").textContent=fouls;
  buzzFeedback(); advance("shake");
}
function scoreOk(){ score++; $("score").textContent=score; sOk(); advance(); }
function scorePass(){ passes++; missed.push(current); $("passes").textContent=passes; advance(); }

/* ---------- roles: each device shows only what its player may see ----------
   me === null  -> a shared screen (pass-the-phone, or a table/judge screen): sees all.
   describer    -> the card, may turn it and pass.
   team-mate    -> NO card. They are the ones guessing.
   opponent     -> the card, but only the named judge can rule and buzz.  */
function roleOf(seat, turnSeat){
  if(seat==null || seat<0) return "watch";
  if(seat===turnSeat) return "describe";
  return teamOf(seat)===teamOf(turnSeat) ? "guess" : "watch";
}
function applyRole(s){
  const turnSeat = s && s.turnSeat!=null ? s.turnSeat : S.turnIdx;
  const seat = me ? me.seat : null;
  const role = roleOf(seat, turnSeat);
  const solo = !me;                          /* nobody has claimed this screen */
  const desc = role==="describe", guess = role==="guess";
  const judgeSeat = s && s.judgeSeat!=null ? s.judgeSeat : judgeIdx();
  const judge = seat!=null && seat===judgeSeat;
  const neutralMaster = mode==="session" && isHost && !following && !me;

  /* the card itself */
  $("deckWrap").hidden = guess || (neutralMaster && !masterCardRevealed);
  $("guessView").hidden = !guess;
  $("masterPeek").hidden = !neutralMaster;
  $("masterReveal").textContent = masterCardRevealed ? T.hideMasterCard : T.showMasterCard;
  if(guess) $("guessWho").innerHTML = T.guessWho(esc(seatName(turnSeat)), esc(seatName(judgeSeat)));

  /* the describer never marks themselves correct; nobody else may pass for them */
  $("okBtn").hidden   = !judge;
  $("buzzBtn").hidden = !judge;
  $("passBtn").hidden = !desc;
  $("turnBtn").hidden = !desc;
  $("hint").hidden = guess;              /* no card, no controls, no instructions */

  /* ending a turn, quitting, rematching: only the device that runs the game.
     A guest pressing these would only desync itself. */
  const runs = isHost || !following;
  $("stopBtn").hidden = !runs;
  $("rdQuit").hidden  = !runs;
  $("finAgain").hidden = !runs;
  $("finEdit").hidden  = !runs;
  $("finHome").hidden  = !runs;

  /* the banner tells you what you are for this turn */
  const banner=$("roleBanner");
  if(solo){ banner.hidden=true; }
  else{
    banner.hidden=false;
    banner.classList.toggle("mine", desc);
    banner.innerHTML = desc  ? `<b>${T.roleDesc}</b>`
                    : guess  ? `<b>${T.roleGuess}</b><span>${esc(seatName(turnSeat))}</span>`
                    : judge  ? `<b>${T.roleJudge}</b><span>${T.roleJudgeNote}</span>`
                             : `<b>${T.roleWatch}</b><span>${T.roleWatchNote}</span>`;
  }

  /* The judge starts; the game-master/shared screen has no implicit role. */
  const mayStart = judge;
  $("rdGo").hidden = !mayStart;
  $("rdSkip").hidden = !desc;
  $("rdWait").hidden = mayStart;
  if(!mayStart) $("rdWait").textContent = T.waitingFor(seatName(judgeSeat));
}

/* ---------- the link: BroadcastChannel, same browser, no server ---------- */
let bc=null, pingTimer=null, lastPong=0, LS=null, lsAt=0, liveTimer=null, LScard=null, LScardAt=0;
const cardFresh = ()=> LScard && (Date.now()-LScardAt) < 5000;
try{ bc = new BroadcastChannel("taboo"); }catch(e){}

/* Two ways out of this window, used together:
   BroadcastChannel reaches other windows of this browser (no server needed),
   Net reaches other devices through the relay in server.js when one is running.
   Every message carries an id so a peer on both paths only acts on it once. */
const ROOM_ALPHABET = "ACDEFGHJKLMNPQRSTUVWXYZ23456789";
const seen = new Set();
let mseq = 0;
const Net = {
  id: Math.random().toString(36).slice(2,10),
  room: "", es: null, peers: 0, ready: false,
  key: "",
  base(){ return (location.origin && /^https?:/.test(location.origin)) ? location.origin : ""; },
  usable(){ return !!this.base() && typeof EventSource !== "undefined"; },
  connect(code){
    code = String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
    if(this.es){ try{ this.es.close(); }catch(e){} this.es=null; }
    this.room = code; this.ready=false; this.peers=0;
    loadPlayed();
    try{ localStorage.setItem("taboo.room", code); }catch(e){}
    if($("roomIn").value !== code) $("roomIn").value = code;
    if(!code || !this.usable()){ netUI(); return; }
    try{
      const es = new EventSource(this.base()+"/events?room="+encodeURIComponent(code)+"&id="+this.id);
      this.es = es;
      es.onopen = ()=>{ this.ready=true; netUI(); post({t:"ping"}); };
      es.onerror = ()=>{ this.ready=false; netUI(); };
      es.onmessage = e=>{ let d; try{ d=JSON.parse(e.data); }catch(err){ return; } handleMsg(d); };
    }catch(e){}
    netUI();
  },
  send(msg){
    if(!this.room || !this.usable()) return;
    try{
      fetch(this.base()+"/send?room="+encodeURIComponent(this.room)+"&id="+this.id+
            (this.key?"&key="+encodeURIComponent(this.key):""), {
        method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify(msg), keepalive:true
      }).then(r=>{
        if(r && r.status===403 && hostOK){ hostOK=false; netUI(); }   /* not the owner after all */
      }).catch(()=>{});
    }catch(e){}
  }
};
/* no server at all -> nothing to police, local play is always allowed */
let hostOK = false;
function mayHost(){ return !Net.usable() || hostOK; }
function checkHostKey(k){
  if(!Net.usable()) { hostOK=true; return Promise.resolve(true); }
  const key = String(k||"").trim().toUpperCase();
  return fetch(Net.base()+"/host"+(key?"?key="+encodeURIComponent(key):""))
    .then(r=>r.ok)
    .then(ok=>{
      if(ok){
        hostOK=true;
        if(key){ Net.key=key; try{ localStorage.setItem("taboo.hostkey", key); }catch(e){} }
      }
      netUI(); return ok;
    })
    .catch(()=>false);
}
function newRoom(){
  let c=""; for(let i=0;i<4;i++) c += ROOM_ALPHABET[Math.floor(Math.random()*ROOM_ALPHABET.length)];
  return c;
}
function netUI(){
  if(!$("netbar")) return;               /* the page is going away */
  if($("rpCode")) renderRoom();
  $("netbar").classList.toggle("on", Net.ready && Net.peers>1);
  $("netMsg").innerHTML = (!Net.usable() || !Net.room) ? T.netOffline
                        : (!Net.ready ? T.netWait : T.netLive(Math.max(Net.peers,1)));
  if($("teamsBtn")) $("teamsBtn").hidden = !mayHost();
  const help=$("netHelp");
  if(Net.usable() && Net.room && !menuEl.hidden){
    help.hidden=false; help.innerHTML = T.netHelp(Net.base(), Net.room);
  } else help.hidden=true;
}
function post(msg){
  msg.from = Net.id;                    /* authenticated/overwritten by the relay */
  msg.mid = Net.id+":"+(++mseq);
  seen.add(msg.mid);
  if(seen.size>500) seen.clear();
  if(bc) try{ bc.postMessage(msg); }catch(e){}
  Net.send(msg);
}
function stateMsg(){
  const inPlay = !playEl.hidden;
  const session = mode==="session" && S.seats.length;
  return {
    t:"state", mode, lang, host:Net.id,
    phase: inPlay?"play":(!readyEl.hidden?"ready":(!endEl.hidden?"end":(!finalEl.hidden?"final":"idle"))),
    lap:S.lap, laps:S.laps,
    teams:[{name:teamName(0),score:S.scores[0]},{name:teamName(1),score:S.scores[1]}],
    roster: S.seats.map((p,i)=>({i, name:p.name, id:p.id||null, team:teamOf(i), afk:!!p.afk, gone:!!p.gone})),
    turnSeat: session ? S.turnIdx : null,
    judgeSeat: session ? judgeIdx() : null,
    turnTeam: session ? teamOf(S.turnIdx) : null,
    player: session ? seatName(S.turnIdx) : null,
    judge:  session ? seatName(judgeIdx()) : null,
    turnPts: score - fouls,
    left, limit, round:{ok:score,pass:passes,buzz:fouls}
  };
}
/* The word only goes to the people allowed to see it: the describer's own
   team-mates are named in `not`, so the relay never sends it to their phones. */
function cardMsg(){
  if(playEl.hidden || !current) return null;
  const blocked = S.seats
    .map((p,i)=>({p,i}))
    .filter(({p,i}) => p.id && i!==S.turnIdx && teamOf(i)===teamOf(S.turnIdx))
    .map(({p}) => p.id);
  return {t:"card", not:blocked, day:localDay(), card:{
    key:cardKey(current),
    w:current.w, r:current.r, ng:current.ng.slice(),
    cat:(T.cats[current.c]||current.c), lvl:T.lvlName[current.d],
    no:$("cardNo").textContent, face:(slot<2?T.faceA:T.faceB)
  }};
}
/* only the device running the game talks about state */
function pushState(){
  if(onCompanion() || (following && !isHost)) return;
  post(stateMsg());
  const c = cardMsg();
  if(c) post(c);
}
function onCompanion(){ return COMPANIONS.some(el=>!el.hidden); }
/* An action arrives with the actor's resolved seat. */
function applyAct(a, seat){
  if(playEl.hidden) return;
  const isDesc = seat!=null && seat===S.turnIdx;
  const isJudge = seat!=null && seat===judgeIdx();
  if((a==="ok" || a==="buzz") && !isJudge) return;
  if((a==="pass" || a==="turn") && !isDesc) return;
  if(a==="ok") scoreOk();
  else if(a==="pass") scorePass();
  else if(a==="buzz") registerBuzz();
  else if(a==="turn") turn();
}
/* my own taps: apply them here if this device runs the game, otherwise ask the host */
function intent(a, expectedKey){
  const seat = me ? me.seat : null;
  if(isHost || !following) applyAct(a, seat);
  else post({t:"act", a, seat, cardKey:expectedKey});
}
function actorSeat(d){
  const id=String(d&&d.from||"");
  const byId=id ? S.seats.findIndex(p=>p.id===id) : -1;
  return byId>=0 ? byId : (Number.isInteger(d&&d.seat) ? d.seat : null);
}
function joinGame(){
  const nm = $("joinName").value.trim();
  if(!nm) return;
  savedSoon();
  const code = $("joinRoom").value.trim();
  if(code && code.toUpperCase() !== Net.room) Net.connect(code);
  me = {id:Net.id, name:nm, seat:-1};
  following = true; isHost = false; mode = "session";
  try{ localStorage.setItem("taboo.me", nm); }catch(e){}
  $("joinStatus").textContent = T.joinWait;
  post({t:"join", id:Net.id, name:nm});
  show(lobbyEl);
  $("lobbyWait").textContent = T.joinWait;
  clearTimeout(joinTimer);
  joinTimer = setTimeout(()=>{ if(me && me.seat<0) $("lobbyWait").textContent = T.joinNone; }, 5000);
}
let joinTimer=null;
function savedSoon(){ setTimeout(save, 0); }   /* after me/following settle */
/* walk straight back into the game after a refresh */
function resume(saved){
  if(saved.role === "player" && saved.me && saved.me.name){
    me = {id:Net.id, name:saved.me.name, seat:-1};
    following = true; isHost = false; mode = "session";
    $("joinName").value = saved.me.name;
    $("joinRoom").value = Net.room;
    show(lobbyEl);
    $("lobbyWait").textContent = T.rejoining;
    post({t:"join", id:Net.id, name:saved.me.name});
    clearTimeout(joinTimer);
    joinTimer = setTimeout(()=>{ if(me && me.seat<0) $("lobbyWait").textContent = T.joinNone; }, 7000);
    return true;
  }
  if(saved.role === "host" && saved.S && saved.S.active && S.seats.length>=4){
    isHost = true; following = false; mode = "session"; picked = true;
    gotoReady();                 /* an interrupted turn is simply taken again */
    return true;
  }
  return false;
}
/* a joined device is a puppet: the host's state decides what it shows */
function follow(s){
  if(isHost || !following) return;
  if(me && me.seat<0){
    const r=(s.roster||[]).find(x=>x.id===Net.id);
    if(r){ me.seat=r.i; me.name=r.name; save(); }
  }
  if(Array.isArray(s.roster))
    S.seats = s.roster.map(r=>({name:r.name, id:r.id, afk:r.afk, gone:r.gone, seen:0}));
  if(s.teams){ S.tnames=[s.teams[0].name,s.teams[1].name]; S.scores=[s.teams[0].score,s.teams[1].score]; }
  if(s.turnSeat!=null) S.turnIdx=s.turnSeat;
  S.judgePick = s.judgeSeat!=null ? s.judgeSeat : null;
  S.lap=s.lap; S.laps=s.laps;
  renderSeats();
  if(s.phase==="play"){
    paintFromState(s);
    if(playEl.hidden) show(playEl);
  }else if(s.phase==="ready"){
    LScard=null; paintCard(null);
    paintReady(); if(readyEl.hidden) show(readyEl);
  }else if(s.phase==="end"){
    $("finalScore").textContent = s.turnPts;
    $("fOk").textContent=s.round.ok; $("fPass").textContent=s.round.pass; $("fBuzz").textContent=s.round.buzz;
    $("addedTo").hidden=false;
    $("addedTo").innerHTML = T.addedTo(esc(teamName(s.turnTeam||0)), s.turnPts);
    $("endBoard").hidden=false; $("endBoard").innerHTML = boardHTML(s.turnTeam);
    $("againBtn").textContent = T.nextTurn;
    if(endEl.hidden) show(endEl);
  }else if(s.phase==="final"){
    $("winTeam").textContent = s.teams[0].score===s.teams[1].score ? T.drawLabel
      : teamName(s.teams[0].score>s.teams[1].score?0:1);
    $("winScore").textContent = Math.max(s.teams[0].score, s.teams[1].score);
    $("finBoard").innerHTML = boardHTML(-1);
    if(finalEl.hidden) show(finalEl);
  }else if(playEl.hidden && readyEl.hidden){
    if(lobbyEl.hidden && me && me.seat>=0) show(lobbyEl);
  }
  if(me && me.seat>=0) $("lobbyWait").textContent = T.lobbyWait;
  applyRole(s);
}
/* the card and clock, written from the host's state instead of the local deck */
function paintFromState(s){
  $("clock").textContent = fmt(Math.max(s.left,0));
  $("clock").classList.toggle("low", s.left<=10);
  hourglass(Math.max(s.left,0)/(s.limit||60), s.left<=10);
  $("score").textContent=s.round.ok; $("passes").textContent=s.round.pass; $("fouls").textContent=s.round.buzz;
  $("nowPlaying").hidden = !s.player;
  if(s.player) $("nowPlaying").innerHTML =
    `<span class="tag">${T.teamNum((s.turnTeam||0)+1)}</span><b>${esc(s.player)}</b>` +
    `<span>${esc(s.teams[s.turnTeam||0].name)}</span><span>${T.judgeShort}: ${esc(s.judge||"")}</span>`;
  paintCard(cardFresh() ? LScard : null);
}
/* null wipes it: a team-mate's phone must not be holding the word anywhere */
function paintCard(c){
  if(!c){
    $("reading").textContent=""; $("target").textContent="";
    $("ngList").innerHTML=""; $("cardNo").textContent=""; $("cardMeta").textContent="";
    $("reading2").textContent=""; $("target2").textContent=""; $("ngList2").innerHTML="";
    return;
  }
  $("reading").textContent=c.r; $("target").textContent=c.w;
  $("ngList").innerHTML = c.ng.map(x=>`<li>${esc(x)}</li>`).join("");
  $("reading2").textContent=""; $("target2").textContent="";
  $("ngList2").innerHTML="";
  $("cardNo").textContent=c.no||"";
  $("cardMeta").textContent = [c.face,c.cat,c.lvl].filter(Boolean).join(" · ");
}
function handleMsg(d){
  d = d || {};
  if(d.mid){
    if(seen.has(d.mid)) return;        /* already arrived on the other path */
    seen.add(d.mid);
    if(seen.size>500) seen.clear();
  }
  if(d.t === "peers"){ Net.peers = d.n||0; netUI(); return; }
  if(d.t === "card"){
    if(d.card && d.card.key) rememberPlayed(d.card.key,d.day,false);
    if(Array.isArray(d.not) && d.not.indexOf(Net.id) >= 0) return;   /* not for me */
    LScard = d.card; LScardAt = Date.now();
    if(!playEl.hidden && following && !isHost) paintCard(LScard);
    if(!judgeEl.hidden) renderLive();
    return;
  }
  if(d.t === "played"){
    const list=Array.isArray(d.cards)?d.cards:[d.key];
    list.forEach(k=>rememberPlayed(k,d.day,false));
    return;
  }

  /* ----- things only the device running the game acts on ----- */
  if(isHost || !following){
    if(d.t === "join"){
      const nm = String(d.name||"").trim().toLowerCase();
      let i = S.seats.findIndex(p=>p.id===d.id);
      /* same name = same person coming back: a reloaded phone reclaims its seat
         (and the name the host typed in advance) instead of adding a duplicate */
      if(i<0) i = S.seats.findIndex(p=>p.name.trim().toLowerCase()===nm);
      if(i<0){
        if(S.seats.length>=16) return;
        S.seats.push({name:String(d.name||"?").slice(0,14), id:d.id, afk:false, gone:false, seen:Date.now()});
      }else{
        S.seats[i].id=d.id; S.seats[i].name=String(d.name||S.seats[i].name).slice(0,14);
        S.seats[i].gone=false; S.seats[i].seen=Date.now();
      }
      renderSeats(); save(); pushState(); return;
    }
    if(d.t === "alive"){
      const p=S.seats.find(x=>x.id===d.id);
      if(p){ p.seen=Date.now(); if(p.gone){ p.gone=false; renderSeats(); pushState(); } }
      return;
    }
    if(d.t === "go"){
      if(!readyEl.hidden && actorSeat(d)===judgeIdx()){ mode="session"; start(); }
      return;
    }
    if(d.t === "next"){ if(!endEl.hidden) advanceAfterTurn(); return; }
    if(d.t === "skip"){
      if(!readyEl.hidden && actorSeat(d)===S.turnIdx) nextTurn();
      return;
    }
  }

  if(d.t === "buzz"){
    if(isHost || !following) applyAct("buzz",actorSeat(d));
  }
  else if(d.t === "act"){
    if(isHost || !following){
      if(d.a==="buzz" && d.cardKey && (!current || cardKey(current)!==d.cardKey)) return;
      applyAct(d.a,actorSeat(d));
    }
  }
  else if(d.t === "ping"){ pushState(); }
  else if(d.t === "state"){
    LS=d; lsAt=Date.now(); lastPong=Date.now();
    follow(d);
    /* a companion window adopts the language the game is being played in */
    /* a companion screen or a joined player follows the language the host is running in */
    if((onCompanion() || following) && !langLocked && d.lang && d.lang!==lang){ lang=d.lang; applyLang(); }
    renderLive(); syncLabel();
  }
  else if(d.t === "round"){ if(!keepEl.hidden){ sk.pend=d.pts; skPaint(); } }
}
if(bc) bc.onmessage = e => handleMsg(e.data);
function live(){ return (LS && Date.now()-lsAt < 8000) ? LS : null; }
function syncLabel(){
  const l = !!live();
  $("bzSync").innerHTML = l ? T.bzLive : T.bzSolo;
}
function startPing(){
  stopPing();
  const p = ()=>{ post({t:"ping"}); renderLive(); syncLabel(); };
  p(); pingTimer = setInterval(p, 2500);
  clearInterval(liveTimer); liveTimer = setInterval(renderLive, 1000);
}
function stopPing(){ clearInterval(pingTimer); clearInterval(liveTimer); pingTimer=liveTimer=null; }

function liveHTML(s){
  const t = s.turnTeam;
  const who = s.player
    ? `<div class="live-now">${esc(s.player)}<small>${esc(t!=null?s.teams[t].name:"")} · ${T.judgeShort} ${esc(s.judge||"—")}</small></div>`
    : `<div class="live-now">${T.quickLive}<small>${T.ok} ${s.round.ok} · ${T.pass} ${s.round.pass} · ${T.buzz} ${s.round.buzz}</small></div>`;
  const board = `<div class="board">${s.teams.map((tm,i)=>
      `<div class="brow${i===t?" on":""}"><span class="who"><span>${esc(tm.name)}</span><small>${T.teamNum(i+1)}</small></span><b>${tm.score}</b></div>`
    ).join("")}</div>`;
  return `<div class="live-head"><span class="live-dot"><i></i>LIVE</span>
            <span>${s.laps ? T.lapOf(s.lap,s.laps) : T.lapEndless(s.lap)}</span></div>
          <div class="hud-row">${who}<div class="live-clock${s.left<=10?" low":""}">${fmt(Math.max(s.left,0))}</div></div>
          ${s.player ? board : ""}`;
}
function renderLive(){
  const s = live();
  [["bzLive",buzzEl],["jgLive",judgeEl],["skLive",keepEl]].forEach(([id,el])=>{
    const box=$(id);
    if(!s || el.hidden){ box.hidden=true; box.innerHTML=""; }
    else { box.hidden=false; box.innerHTML = liveHTML(s); }
  });
  if(!buzzEl.hidden) $("bzBtn").hidden=!(s&&me&&me.seat===s.judgeSeat);
  if(!judgeEl.hidden) renderJudgeCard(s);
}
function renderJudgeCard(s){
  const c = (s && s.phase==="play" && cardFresh()) ? LScard : null;
  if(!c){
    $("jgCard").innerHTML=""; $("jgActions").hidden=true;
    $("jgWait").hidden=false; $("jgWait").innerHTML = T.jgWaiting;
    $("jgNote").hidden=true;
    return;
  }
  const mayJudge=!!(me && s && me.seat===s.judgeSeat);
  $("jgWait").hidden=true; $("jgActions").hidden=!mayJudge;
  $("jgNote").hidden=false; $("jgNote").innerHTML = T.jgNote;
  $("jgCard").innerHTML = `
    <article class="card">
      <div class="side side-a">
        <div class="band">
          <div class="reading">${esc(c.r)}</div>
          <h2 class="target">${esc(c.w)}</h2>
        </div>
        <ul class="ng">${c.ng.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>
      <div class="seam">
        <span class="no">${esc(c.no)}</span>
        <span class="meta">${esc(c.face)} · ${esc(c.cat)} · ${esc(c.lvl)}</span>
      </div>
    </article>`;
}

/* ---------- ask before a buzz ---------- */
let askPending=null;
const activeCardKey = ()=>{
  const c=(isHost || !following) ? current : LScard;
  return c ? (c.key || cardKey(c)) : null;
};
function askBuzz(fn){
  askPending = {fn, key:activeCardKey()};
  $("askBuzz").hidden = false;
  try{ $("askYes").focus(); }catch(e){}
}
$("askYes").onclick = ()=>{
  const pending=askPending; askPending=null; $("askBuzz").hidden=true;
  /* A pass/turn may have changed the card while the dialog was open. */
  if(pending && pending.key && activeCardKey()===pending.key) pending.fn(pending.key);
};
$("askNo").onclick  = ()=>{ askPending=null; $("askBuzz").hidden=true; };

/* ---------- companion: buzzer ---------- */
let bzCount=0;
function bzHit(expectedKey){
  const s=live();
  if(!me || !s || me.seat!==s.judgeSeat) return;
  bzCount++; $("bzCount").textContent = bzCount;
  buzzFeedback(); post({t:"act",a:"buzz",seat:me.seat,cardKey:expectedKey||activeCardKey()});
}
$("bzBtn").onclick   = ()=>askBuzz(bzHit);
$("bzReset").onclick = ()=>{ bzCount=0; $("bzCount").textContent=0; };
$("bzBack").onclick  = leaveCompanion;

/* ---------- companion: judge ---------- */
$("jgOk").onclick   = ()=>{ if(me){ sOk(); post({t:"act",a:"ok",seat:me.seat}); } };
$("jgBuzz").onclick = ()=>askBuzz(key=>{ if(me){ buzzFeedback(); post({t:"act",a:"buzz",seat:me.seat,cardKey:key}); } });
$("jgBack").onclick = leaveCompanion;

/* ---------- companion: scorekeeper ---------- */
const sk = {a:0, b:0, log:[], pend:null};
function skPaint(){
  $("skPtsA").textContent = sk.a;
  $("skPtsB").textContent = sk.b;
  const box = $("skPending");
  if(sk.pend === null){ box.hidden = true; box.innerHTML=""; }
  else{
    box.hidden = false;
    box.innerHTML = T.skPend(sk.pend) +
      `<div style="display:flex;gap:6px;margin-top:8px">
         <button class="btn btn-light" type="button" data-pend="a" style="flex:1;font-size:13px;padding:10px 6px">${esc(T.skTo($("skNameA").value))}</button>
         <button class="btn btn-light" type="button" data-pend="b" style="flex:1;font-size:13px;padding:10px 6px">${esc(T.skTo($("skNameB").value))}</button>
       </div>`;
  }
}
function skAdd(team,d){ sk[team]+=d; sk.log.push([team,d]); skPaint(); save(); }
keepEl.addEventListener("click", e=>{
  const add=e.target.closest("button[data-team]");
  if(add){ skAdd(add.dataset.team, Number(add.dataset.d)); return; }
  const pend=e.target.closest("button[data-pend]");
  if(pend && sk.pend!==null){ const p=sk.pend; sk.pend=null; skAdd(pend.dataset.pend, p); }
});
$("skUndo").onclick  = ()=>{ const l=sk.log.pop(); if(l){ sk[l[0]]-=l[1]; skPaint(); save(); } };
$("skReset").onclick = ()=>{ sk.a=0; sk.b=0; sk.log=[]; sk.pend=null; skPaint(); save(); };
$("skBack").onclick  = leaveCompanion;
$("skNameA").oninput = save;
$("skNameB").oninput = save;

/* hang up when the phone locks or the tab closes, so the room's screen count is honest */
window.addEventListener("pagehide", ()=>{ if(Net.es) try{ Net.es.close(); }catch(e){} });

$("roomIn").addEventListener("change", ()=>Net.connect($("roomIn").value));
$("roomIn").addEventListener("keydown", e=>{
  if(e.code==="Enter"){ e.preventDefault(); Net.connect($("roomIn").value); e.target.blur(); }
});
$("netCopy").onclick = ()=>{
  const h = parseHash();
  const link = Net.base() ? Net.base()+"/#"+(h.screen || "judge")+"="+Net.room : Net.room;
  const done = ()=>{
    $("netCopy").textContent = T.copied;
    setTimeout(()=>{ $("netCopy").textContent = T.copyLink; }, 1400);
  };
  try{ navigator.clipboard.writeText(link).then(done, done); }catch(e){ done(); }
};

/* ---------- wiring ---------- */
/* the gate starts the app; the language of the cards is the host's setting */
$("gateStart").onclick = ()=>{ picked=true; applyLang(); show(menuEl); };
/* The buzzer / judge / scorekeeper screens are no longer offered: every
   opponent judges and buzzes from their own phone, and the scoreboard is in
   the game. The routes still answer (#buzzer / #judge / #score) if wanted. */

$("gearBtn").onclick = ()=>show(setEl);
$("setBack").onclick = ()=>show(backTo && backTo!==setEl ? backTo : (picked?menuEl:gateEl));
$("teamsBtn").onclick = ()=>{
  if(!mayHost()) return;                 /* not this machine: the button is not even shown */
  isHost=true; following=false; renderSeats(); show(setupEl);
};
$("joinBtn").onclick  = ()=>{ openJoin(); };
$("gateJoin").onclick = ()=>{ picked=true; applyLang(); openJoin(); };
function openJoin(){
  if(!$("joinName").value){
    try{ $("joinName").value = localStorage.getItem("taboo.me") || ""; }catch(e){}
  }
  $("joinRoom").value = Net.room || "";
  $("joinStatus").textContent = "";
  show(joinEl);
}
$("joinBack").onclick = ()=>show(picked ? menuEl : gateEl);
$("joinGo").onclick   = joinGame;
$("joinName").addEventListener("keydown", e=>{ if(e.code==="Enter"){ e.preventDefault(); joinGame(); } });
$("joinRoom").addEventListener("keydown", e=>{ if(e.code==="Enter"){ e.preventDefault(); joinGame(); } });
$("lobbyLeave").onclick = ()=>{
  me=null; following=false; clearTimeout(joinTimer);
  show(picked ? menuEl : gateEl);
};
$("setupBack").onclick = ()=>show(menuEl);
$("setupGo").onclick = startSession;
$("rdGo").onclick = ()=>{
  const seat=me?me.seat:null;
  if(seat!==judgeIdx()) return;
  if(isHost || !following){ mode="session"; start(); }
  else post({t:"go",seat});
};
$("rdSkip").onclick = ()=>{
  const seat=me?me.seat:null;
  if(seat!==S.turnIdx) return;
  if(isHost || !following) nextTurn();
  else post({t:"skip",seat});
};
$("rdQuit").onclick = ()=>{ S.active=false; show(menuEl); save(); };
$("rulesBtn").onclick = ()=>show(rulesEl);
$("backBtn").onclick  = ()=>show(menuEl);
function advanceAfterTurn(){
  if(mode==="session" && S.seats.length) nextTurn(); else show(menuEl);
}
$("againBtn").onclick = ()=>{
  if(isHost || !following) advanceAfterTurn();
  else post({t:"next"});
};
$("finAgain").onclick = ()=>{ S.scores=[0,0]; S.stats={}; S.turnIdx=0; S.lap=1; S.active=true; gotoReady(); };
$("finEdit").onclick  = ()=>{ renderSeats(); show(setupEl); };
$("finHome").onclick  = ()=>show(menuEl);
$("stopBtn").onclick  = finish;
$("okBtn").onclick    = ()=>intent("ok");
$("passBtn").onclick  = ()=>intent("pass");
$("buzzBtn").onclick  = ()=>askBuzz(key=>intent("buzz",key));
$("masterReveal").onclick = ()=>{
  masterCardRevealed=!masterCardRevealed;
  applyRole(LS);
};
$("turnBtn").onclick  = e=>{ e.stopPropagation(); intent("turn"); };
$("card").onclick     = e=>{ if(!e.target.closest("#turnBtn")) intent("turn"); };

document.addEventListener("keydown", e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(typing) return;
  if(!$("askBuzz").hidden){
    if(e.code==="Escape"){ e.preventDefault(); $("askNo").click(); }
    else if(e.code==="Enter"){ e.preventDefault(); $("askYes").click(); }
    return;
  }
  if(!playEl.hidden){
    if(e.code==="Space"){ e.preventDefault(); if(!$("okBtn").hidden) intent("ok"); }
    else if(e.code==="ArrowRight"){ e.preventDefault(); if(!$("passBtn").hidden) intent("pass"); }
    else if(e.key==="b"||e.key==="B"){ e.preventDefault(); if(!$("buzzBtn").hidden) askBuzz(key=>intent("buzz",key)); }
    else if(e.key==="r"||e.key==="R"||e.code==="ArrowDown"){ e.preventDefault(); intent("turn"); }
  } else if(!buzzEl.hidden){
    if((e.code==="Space"||e.code==="Enter") && document.activeElement!==$("bzBtn")){ e.preventDefault(); bzHit(); }
  } else if(!judgeEl.hidden){
    if(e.code==="Space"){ e.preventDefault(); $("jgOk").click(); }
    else if(e.key==="b"||e.key==="B"){ e.preventDefault(); $("jgBuzz").click(); }
  } else if(!joinEl.hidden){
    if(e.code==="Enter"){ e.preventDefault(); joinGame(); }
  } else if(!gateEl.hidden){
    if(e.code==="Enter"||e.code==="Space"){ e.preventDefault(); $("gateStart").click(); }
  } else if(!readyEl.hidden){
    if(e.code==="Enter"||e.code==="Space"){ e.preventDefault(); $("rdGo").click(); }
  } else if(!menuEl.hidden || !setEl.hidden){
    if(!menuEl.hidden && e.code==="Enter") $("teamsBtn").click();
    else if(e.key==="t"||e.key==="T"){ skin = SKINS[(SKINS.indexOf(skin)+1)%SKINS.length]; applySkin(); }
  }
});

/* ---------- presence ----------
   Heartbeats help a refreshed phone reclaim its seat, but never change turn
   eligibility. Backgrounded mobile browsers routinely pause JavaScript. */
setInterval(()=>{
  if(following && me && me.seat>=0) post({t:"alive", id:Net.id});
}, 6000);

/* ---------- boot ---------- */
(function boot(){
  const s = load();
  if(SKINS.includes(s.skin)) skin=s.skin;
  if(typeof s.sound==="boolean") sound=s.sound;
  if(s.lang==="en"||s.lang==="ja") lang=s.lang;
  if(s.deckLang==="en"||s.deckLang==="ja") deckLang=s.deckLang;
  if(Number.isFinite(s.level)) level=s.level;
  if(Number.isFinite(s.limit)) limit=s.limit;
  if(s.S){
    if(Array.isArray(s.S.seats)) S.seats = s.S.seats.slice(0,16).map(x =>
      typeof x === "string" ? {name:x, id:null, afk:false, gone:false, seen:0}
                            : {name:String(x.name||"?"), id:null, afk:!!x.afk, gone:false, seen:0});
    if(Array.isArray(s.S.tnames)) S.tnames=s.S.tnames;
    if(Array.isArray(s.S.scores)) S.scores=s.S.scores;
    if(s.S.stats && typeof s.S.stats==="object") S.stats=s.S.stats;
    if(Number.isFinite(s.S.laps)) S.laps=s.S.laps;
    if(Number.isFinite(s.S.lap)) S.lap=s.S.lap;
    if(Number.isFinite(s.S.turnIdx)) S.turnIdx=s.S.turnIdx;
    if(typeof s.S.active==="boolean") S.active=s.S.active;
  }
  if(s.sk){
    sk.a=Number(s.sk.a)||0; sk.b=Number(s.sk.b)||0;
    if(s.sk.na) $("skNameA").value=s.sk.na;
    if(s.sk.nb) $("skNameB").value=s.sk.nb;
  }
  $("tName0").value = S.tnames[0]||""; $("tName1").value = S.tnames[1]||"";
  document.querySelectorAll("#segLevel button").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.v)===level)));
  document.querySelectorAll("#segTime button").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.v)===limit)));
  document.querySelectorAll("#segLaps button").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.v)===S.laps)));
  let room="";
  try{ room = localStorage.getItem("taboo.room") || ""; }catch(e){}
  if(s.room) room = s.room;
  const h = parseHash();
  if(h.room) room = h.room;
  if(!room) room = newRoom();
  picked = !!s.picked;
  try{ Net.key = localStorage.getItem("taboo.hostkey") || ""; }catch(e){}
  try{
    const q = new URLSearchParams(location.search).get("host");
    if(q) Net.key = q.toUpperCase();
  }catch(e){}
  checkHostKey(Net.key);              /* no key needed when this IS the machine */
  applySkin(); applyDeck(); applyLang(); skPaint(); hourglass(1,false);
  Net.connect(room);
  if(parseHash().screen) return route();     /* an explicit #judge / #buzzer link wins */
  if(resume(s)) return;
  route();
})();
</script>
